name: Collect daily figures

# Once a day, just after midnight UTC: read the day that just ended from the
# chain, commit it to public/data/, and publish the site again. Everything it
# reads is public chain data, so it needs no keys.

on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Long enough for the step below to finish and still leave room to commit.
    timeout-minutes: 340
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every finished day not yet collected, plus the last one again
      # (--redo 1): an indexer running a little behind at midnight would
      # otherwise leave that day short for good. A failure here still lets
      # the days that did finish be committed below.
      #
      # The timeout belongs on the step, not only on the job. A job cancelled
      # for running long takes the commit step down with it, so three nights
      # of collected days were thrown away and the backlog they would have
      # cleared grew instead: seven days to read where there should be one,
      # which is what made the next night run long as well. Cut the collector
      # off here and the days it did finish are still committed.
      # A hundred minutes was enough for one day of everything and is no
      # longer enough for a backlog. Mission Control alone costs about half an
      # hour a day to read — thirty-two minutes a day on 17 October, twelve for
      # its separate report — so four days behind is already over the old
      # budget before anything else is read, and the steps after it never ran:
      # Planetary Defense and the other project reports went eight days
      # without an update while the run "succeeded" at reading Mission
      # Control. Worse, a run cut off leaves a longer backlog than it started
      # with, so the shortfall compounds night after night.
      #
      # Five hours is room to catch up from a week behind in one night. A run
      # with nothing to catch up on still takes about forty minutes.
      - id: collect
        continue-on-error: true
        timeout-minutes: 320
        run: npm run collect -- --redo 1

      - id: commit
        name: Commit what was collected
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily figures through $(date -u -d yesterday +%F)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fail if the collector did
        if: steps.collect.outcome == 'failure'
        run: |
          echo "The collector stopped early; whatever days it finished were committed."
          exit 1

  # A push made with the workflow's own token starts no other workflow, so
  # the deploy is called directly — on the commit just pushed.
  deploy:
    needs: collect
    if: always() && needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
