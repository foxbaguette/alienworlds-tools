<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f2" />
    <link rel="icon" href="./favicon.webp" type="image/webp" />
    <title>Alien Worlds Tools</title>
    <meta name="description" content="Data analysis for Alien Legends, read straight from the WAX chain." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap"
    />
    <script>
      /* The theme before first paint, so it never flashes: light unless the viewer chose otherwise. */
      var t = 'light'
      try {
        t = localStorage.getItem('alestats.theme') || 'light'
      } catch (e) {}
      if (t !== 'system') document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
